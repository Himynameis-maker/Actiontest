<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鉤爪の二足歩行リグ（AI生成パーツ）</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceae6;--fg:#1d1d22;--muted:#5d5b66;--panel:#dedbd5;--line:#bdb8ae;--accent:#a8222b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141417;--fg:#e9e7e2;--muted:#a4a1aa;--panel:#202026;--line:#37373f;--accent:#e0505a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141417;--fg:#e9e7e2;--muted:#a4a1aa;--panel:#202026;--line:#37373f;--accent:#e0505a}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
main{max-width:800px;margin:0 auto}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{margin:0 0 12px;color:var(--muted);font-size:.88rem}
canvas{display:block;width:100%;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#1b1b21}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:12px;padding:10px 12px;background:var(--panel);border-radius:6px;font-size:.88rem}
button{font:inherit;padding:6px 14px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
button.sw{background:var(--fg);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
label{display:flex;gap:6px;align-items:center}
#st{margin-left:auto;font-variant-numeric:tabular-nums}
select,input[type=text]{font:inherit;padding:3px 6px;max-width:100%}
.bar input[type=range]{width:110px}
.num{min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
#jout{flex:1 1 220px;min-width:0}
</style>
</head>
<body>
<main>
<h1>鉤爪の二足歩行リグ（AI生成パーツ）</h1>
<p class="sub">ステージは無限に続きます。向きは自分で切り替えます（← → キー、A D キー、またはボタン）。Space で攻撃です。</p>
<canvas id="c"></canvas>
<div class="bar">
  <button class="sw" id="bl">← 左向き</button>
  <button class="sw" id="br">右向き →</button>
  <button id="atk">今すぐ攻撃</button>
  <label>技 <select id="mv"><option value="random">ランダム</option><option value="a">1</option><option value="b">1→2（振り上げ）</option><option value="c">1→2→3（叩きつけ）</option><option value="d">突進（爪で削る）</option></select></label>
  <span id="st">読み込み中</span>
</div>
<div class="bar">
  <label>攻撃頻度 <input id="freq" type="range" min="0.3" max="3" step="0.1" value="1"></label>
  <label>浮かせ度 <input id="gap" type="range" min="-4" max="12" step="1" value="0"></label>
  <label>攻撃中の手 <select id="hf"><option value="mirror">左右反転</option><option value="none">そのまま</option></select></label>
  <label>走りの低さ <input id="rl" type="range" min="0" max="1" step="0.05" value="0"></label>
  <label><input id="dbg" type="checkbox">ピボット表示</label>
</div>
<div class="bar">
  <label>関節調整 <select id="jn"><option value="head">頭（首のつなぎ目）</option><option value="torso">胴体（腰のつなぎ目）</option><option value="shoulder">肩</option><option value="elbow">肘</option><option value="wrist">手首</option><option value="hip">股関節</option><option value="knee">膝</option><option value="ankle">足首</option></select></label>
  <label>X（前＋） <input id="jx" type="range" min="-30" max="30" step="0.5" value="0"><span id="jxv" class="num">0</span></label>
  <label>Y（下＋） <input id="jy" type="range" min="-30" max="30" step="0.5" value="0"><span id="jyv" class="num">0</span></label>
  <button id="jr">初期値に戻す</button>
  <input id="jout" type="text" readonly aria-label="現在の調整値">
</div>
</main>

const C=DATA.cfg,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=440,GY=408,CX=400,S=0.17,dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t*t*(3-2*t),easeOut=t=>1-(1-t)*(1-t),rnd=(a,b)=>a+Math.random()*(b-a);
const mix=(a,b,t)=>{const o={};for(const k in a)o[k]=lerp(a[k],b[k],t);return o};
const rot=(v,a)=>{const c=Math.cos(a),s=Math.sin(a);return[v[0]*c-v[1]*s,v[0]*s+v[1]*c]};
const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
const hash=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};

// ---- images / joints ----
const IM={};let G=0,RL=0,debug=false,freq=1,hflip=1,flipMode='mirror';
const ADJ={head:[0,5],torso:[0,5],shoulder:[0,0],elbow:[0,0],wrist:[0,0],hip:[0,0],knee:[0,0],ankle:[0,0]};
const DEF=JSON.parse(JSON.stringify(ADJ));
const J=(k,o)=>[o[0]+ADJ[k][0],o[1]+ADJ[k][1]];
const loads=Object.entries(DATA.img).map(([k,v])=>new Promise(r=>{const i=new Image();i.onload=r;i.src='data:image/png;base64,'+v;IM[k]=i}));
const off=(n,k,g)=>[(C[n][k][0]-C[n].pivot[0])*S,(C[n][k][1]-C[n].pivot[1])*S+g];
const K=((C.thigh.end[1]-C.thigh.pivot[1])+(C.shin.end[1]-C.shin.pivot[1]))*S/92;

// ---- poses (angles rad, relative to parent; + swings a hanging limb backward). ik: arm-to-ground weight, ikp: preferred world angle ----
const P0={pel:0,ik:0,ikp:0};
const WIND={...P0,tor:-0.28,head:-0.2,uaR:2.7,faR:-0.2,uaL:-0.6,faL:-0.5,thA:-0.5,shA:1.0,thB:-0.4,shB:0.9,lunge:-12};
const STRIKE={...P0,tor:0.4,head:0.25,uaR:-1.1,faR:-0.5,uaL:0.7,faL:-0.4,thA:-0.75,shA:0.75,thB:0.5,shB:0.3,lunge:34};
const RISE={...P0,tor:-0.12,head:-0.3,uaR:-2.9,faR:-0.3,uaL:0.9,faL:-0.3,thA:-0.8,shA:0.8,thB:0.5,shB:0.4,lunge:40};
const SLAM={...P0,tor:1.2,head:0.2,uaR:-1.0,faR:-0.4,uaL:0.9,faL:-0.4,thA:-1.3,shA:2.0,thB:-1.1,shB:1.9,lunge:45,ik:1,ikp:-0.3};
const CROUCH={...P0,tor:1.1,head:-0.9,uaR:0.8,faR:-0.2,uaL:0.8,faL:-0.2,thA:-1.2,shA:1.9,thB:-1.0,shB:1.7,lunge:-14};
const RISE2={...RISE,uaL:-2.9,faL:-0.3};
function walkPose(p){
  const s=Math.sin(p),c=Math.cos(p);
  return {...P0,tor:0.04+0.05*s,head:0.1*Math.sin(p+1),uaR:s*0.35,faR:-0.35-0.15*s,uaL:-s*0.35,faL:-0.3+0.1*s,
    thA:-s*0.5,shA:Math.max(0,c)*0.9+0.08,thB:s*0.5,shB:Math.max(0,-c)*0.9+0.08,lunge:0};
}
// run form: RL=0 normal upright-ish run, RL=1 low run (claws reach the floor). Arms hang limp and lag behind.
function dashPose(p){
  const s=Math.sin(p),L=(x,y)=>lerp(x,y,RL),T=L(0.9,1.25),b=L(0.35,1.15),a=L(0.8,0.45),s0=L(1.0,1.7),s1=L(1.4,0.5);
  return {...P0,tor:T,head:0.15-T,uaR:0.15-T+0.22*Math.sin(p-1),faR:-0.25+0.15*Math.sin(p-1.4),uaL:0.1-T+0.22*Math.sin(p+2.1),faL:-0.2+0.15*Math.sin(p+1.7),
    thA:-b-a*s,shA:s0+s1*Math.max(0,Math.cos(p-0.6)),thB:-b+a*s,shB:s0+s1*Math.max(0,Math.cos(p+2.54)),lunge:20,ik:RL,ikp:0.25};
}

// ---- moves: [name, duration, target pose, options]  (f: flip hands, v: speed from/to, e: easing) ----
const A1=()=>[['wind',rnd(.5,.9),WIND],['hold',rnd(.1,.4),WIND],['strike',.12,STRIKE,{f:1,e:'out'}]];
const MOVES={
  a:()=>[...A1(),['after',.25,STRIKE,{f:1}],['rec',.7,'walk']],
  b:()=>[...A1(),['rise',.14,RISE,{f:1,e:'out'}],['top',.25,RISE,{f:1}],['rec',.8,'walk']],
  c:()=>[...A1(),['rise',.14,RISE,{f:1,e:'out'}],['top',.2,RISE,{f:1}],['slam',.12,SLAM,{f:1,e:'in',imp:1}],['slamH',.4,SLAM,{f:1}],['rec',.9,'walk']],
  d:()=>[['crouch',.55,CROUCH],['cH',rnd(.2,.4),CROUCH],['dash',rnd(1,1.8),null,{kind:'dash'}],['rise',.16,RISE2,{f:1,e:'out',v:[440,0]}],['top',.25,RISE2,{f:1}],['rec',.8,'walk']]
};
const MNAME={a:'1',b:'1→2',c:'1→2→3',d:'突進'};
const LABEL={walk:'歩行',wind:'予備動作',hold:'溜め',strike:'攻撃1',after:'余韻',rise:'振り上げ',top:'余韻',slam:'叩きつけ',slamH:'余韻',crouch:'しゃがみ',cH:'溜め',dash:'突進',rec:'戻り'};
const pick=()=>{const r=Math.random();return r<.2?'a':r<.45?'b':r<.7?'c':'d'};

// ---- state ----
let world=0,dir=1,dd=1,pendDir=0,phase=0,time=0,next=2,seg=null,segs=[],si=0,t=0,from=null,lastP=walkPose(0),moveSel='random',curMove='',shake=0;
let trail=[],tip=null,parts=[],scr=[],lastWx=null;
function setDir(d){if(seg)pendDir=d;else dir=d}
function begin(m){curMove=m==='random'?pick():m;segs=MOVES[curMove]();si=-1;nextSeg()}
function nextSeg(){
  si++;
  if(si>=segs.length){seg=null;next=rnd(1.5,4.5)/freq;if(pendDir){dir=pendDir;pendDir=0}return}
  seg=segs[si];t=0;from=lastP;
}
function impact(){if(tip)for(let i=0;i<18;i++)parts.push({x:tip.x,y:GY,vx:rnd(-240,240),vy:-rnd(60,280),t:0,l:rnd(.25,.5)});shake=.3}
function update(dt){
  time+=dt;shake=Math.max(0,shake-dt);
  const o=seg&&seg[3]||{};
  const ft=(flipMode==='mirror'&&o.f)?-1:1;
  hflip+=Math.sign(ft-hflip)*Math.min(Math.abs(ft-hflip),dt*33);
  dd+=Math.sign(dir-dd)*Math.min(Math.abs(dir-dd),dt*18);
  let v=0;
  if(!seg){
    phase+=dt*6;v=70;next-=dt;
    if(next<=0)begin(moveSel);
  }else{
    t+=dt;
    if(o.kind==='dash'){phase+=dt*16;v=440*Math.min(1,t/.25)}
    else if(o.v)v=lerp(o.v[0],o.v[1],ease(Math.min(1,t/seg[1])));
    if(t>=seg[1]){if(o.imp)impact();nextSeg()}
  }
  world+=dir*v*dt;
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=900*dt}
  parts=parts.filter(p=>p.t<p.l);
  scr=scr.filter(s=>time-s.t<5);
}
function pose(){
  if(!seg)return walkPose(phase);
  const o=seg[3]||{};
  if(o.kind==='dash')return mix(CROUCH,dashPose(phase),ease(Math.min(1,t/.2)));
  const to=seg[2]==='walk'?walkPose(phase):seg[2];
  let u=Math.min(1,t/seg[1]);u=o.e==='in'?u*u:o.e==='out'?easeOut(u):ease(u);
  return mix(from,to,u);
}

// ---- kinematics (local, hip-origin frame; used for ground contact and claw-to-ground IK) ----
function footBottom(th,sh,dx){
  const k=add(J('hip',[dx,0]),rot(J('knee',off('thigh','end',G)),th));
  const a=add(k,rot(J('ankle',off('shin','end',G)),th+sh));
  const psi=th+sh+Math.max(-0.9,Math.min(0.9,-(th+sh)*0.9)),cs=Math.cos(psi),sn=Math.sin(psi);
  return a[1]+Math.max(-25*sn+125*cs,130*sn+125*cs)*S;
}
function armTip(P,hy,ua,fa){
  const tp=add(J('torso',off('pelvis','top',-G)),[0,hy]);
  const sh=add(tp,rot(J('shoulder',off('torso','shoulder',0)),P.tor));
  const el=add(sh,rot(J('elbow',off('uarm','end',G)),P.tor+ua));
  const wr=add(el,rot(J('wrist',off('farm','end',G)),P.tor+ua+fa));
  const t=C.hand.tip,p=C.hand.pivot;
  return add(wr,rot([(t[0]-p[0])*S,(t[1]-p[1])*S],P.tor+ua+fa*1.5));
}
function ikArm(P,hy,fa,pw){
  const c=pw-P.tor;let best=c,be=1e9;
  for(let i=-30;i<=30;i++){const u=c+i*0.045,e=Math.abs(armTip(P,hy,u,fa)[1]-(GY-2))+25*Math.abs(u-c);if(e<be){be=e;best=u}}
  return best;
}

// ---- drawing ----
function dot(){if(!debug)return;ctx.beginPath();ctx.arc(0,0,3.5,0,7);ctx.fillStyle='#ff3b4a';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#fff';ctx.stroke()}
function put(n,o,r,kids,dark,behind){
  ctx.save();ctx.translate(o[0],o[1]);ctx.rotate(r);if(n==='hand')ctx.scale(hflip,1);
  if(behind)behind();
  const c=C[n];
  ctx.drawImage(IM[dark?n+'_d':n],-c.pivot[0]*S,-c.pivot[1]*S,c.w*S,c.h*S);
  if(kids)kids();
  if(n==='hand'&&!dark){const q=C.hand.tip,p=ctx.getTransform().transformPoint(new DOMPoint((q[0]-c.pivot[0])*S,(q[1]-c.pivot[1])*S));tip={x:p.x/dpr,y:p.y/dpr}}
  dot();ctx.restore();
}
function arm(ua,fa,dark){
  put('uarm',J('shoulder',off('torso','shoulder',0)),ua,()=>
    put('farm',J('elbow',off('uarm','end',G)),fa,()=>
      put('hand',J('wrist',off('farm','end',G)),fa*0.5,null,dark),dark),dark);
}
function leg(th,sh,dark,dx){
  put('thigh',J('hip',[dx,0]),th,()=>
    put('shin',J('knee',off('thigh','end',G)),sh,()=>
      put('foot',J('ankle',off('shin','end',G)),Math.max(-0.9,Math.min(0.9,-(th+sh)*0.9)),null,dark),dark),dark);
}
function layer(sp,f,fn){
  const o=world*f,i0=Math.floor((o-CX-80)/sp),i1=Math.ceil((o+W-CX+80)/sp);
  for(let i=i0;i<=i1;i++)fn(i*sp-o+CX,i);
}
function background(){
  const g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,'#15151b');g.addColorStop(1,'#26262e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GY);
  layer(170,0.2,(x,i)=>{const w=34+hash(i)*34,h=130+hash(i+9)*130;ctx.fillStyle='#1e1e26';ctx.fillRect(x-w/2,GY-30-h,w,h+30)});
  layer(260,0.5,(x,i)=>{
    ctx.fillStyle='#2b2b35';ctx.fillRect(x-8,0,16,GY-8);ctx.fillRect(x-14,GY-22,28,14);
    if(hash(i+3)<.35){ctx.fillStyle='rgba(190,40,50,.55)';ctx.beginPath();ctx.arc(x,70+hash(i)*40,5,0,7);ctx.fill()}
  });
  ctx.fillStyle='#24242c';ctx.fillRect(0,GY,W,H-GY);
  ctx.fillStyle='#3b3b46';ctx.fillRect(0,GY,W,2);
  layer(70,1,(x,i)=>{ctx.fillStyle='#34343e';ctx.fillRect(x,GY+8,3,10);if(hash(i+5)<.3)ctx.fillRect(x+20,GY+22+hash(i)*6,12+hash(i+2)*14,3)});
}
function render(P){
  P=Object.assign({},P);
  P.tor+=Math.sin(time*1.3)*0.03;
  P.head+=Math.sin(time*1.7)*0.1+Math.sin(time*5.1)*0.03;
  const nm=seg&&seg[0];
  if(nm==='wind'||nm==='hold'||nm==='crouch'||nm==='cH'){const j=Math.sin(time*55);P.uaR+=j*0.025;P.pel+=j*1.2;P.head+=j*0.04}
  const hy=GY-Math.max(footBottom(P.thA,P.shA,0),footBottom(P.thB,P.shB,-3))+P.pel;
  if(P.ik>0.01){P.uaR=lerp(P.uaR,ikArm(P,hy,P.faR,P.ikp),P.ik);P.uaL=lerp(P.uaL,ikArm(P,hy,P.faL,P.ikp+0.3),P.ik)}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingQuality='high';
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*20);
  background();
  // claw gouges on the floor
  ctx.lineCap='round';
  for(const s of scr){
    const a=1-(time-s.t)/5,x1=s.a-world+CX,x2=s.b-world+CX;
    ctx.lineWidth=2;ctx.strokeStyle='rgba(8,8,12,'+(a*.8).toFixed(2)+')';ctx.beginPath();ctx.moveTo(x1,GY+5);ctx.lineTo(x2,GY+5);ctx.stroke();
    ctx.strokeStyle='rgba(150,150,165,'+(a*.35).toFixed(2)+')';ctx.beginPath();ctx.moveTo(x1,GY+8);ctx.lineTo(x2,GY+8);ctx.stroke();
  }
  ctx.beginPath();ctx.ellipse(CX+dd*P.lunge*K*0.6,GY+6,52,8,0,0,7);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fill();

  tip=null;
  ctx.save();
  ctx.translate(CX,hy);ctx.scale(dd,1);ctx.translate(P.lunge*K,0);
  leg(P.thB,P.shB,true,-3);
  put('pelvis',[0,0],0,null,false);
  leg(P.thA,P.shA,false,0);
  put('torso',J('torso',off('pelvis','top',-G)),P.tor,()=>{
    put('head',J('head',off('torso','head',-G)),P.head,null,false);
    arm(P.uaR,P.faR,false);
  },false,()=>arm(P.uaL,P.faL,true));
  ctx.restore();
  ctx.restore();

  ctx.setTransform(dpr,0,0,dpr,0,0);
  const o=seg&&seg[3]||{};
  if(o.kind==='dash'&&tip&&tip.y>GY-14){
    const wx=world+(tip.x-CX);if(lastWx!==null)scr.push({a:lastWx,b:wx,t:time});lastWx=wx;
    for(let i=0;i<3;i++)parts.push({x:tip.x,y:GY-2,vx:-dir*rnd(60,240),vy:-rnd(40,230),t:0,l:rnd(.15,.35)});
  }else lastWx=null;
  if(o.f&&tip&&(nm==='strike'||nm==='rise'||nm==='slam'))trail.push({x:tip.x,y:tip.y,t:time});
  trail=trail.filter(p=>time-p.t<0.3);
  for(let i=1;i<trail.length;i++){
    const a=1-(time-trail[i].t)/0.3;
    ctx.strokeStyle='rgba(255,90,100,'+a.toFixed(2)+')';ctx.lineWidth=10*a;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
  }
  for(const p of parts){const a=1-p.t/p.l;ctx.fillStyle='rgba(255,'+(170+a*70|0)+',110,'+a.toFixed(2)+')';ctx.fillRect(p.x,p.y,3,3)}
}

// ---- UI ----
const $=id=>document.getElementById(id),stEl=$('st');let shown='';
$('atk').onclick=()=>{if(!seg)begin(moveSel)};
$('mv').onchange=e=>{moveSel=e.target.value};
$('bl').onclick=()=>setDir(-1);$('br').onclick=()=>setDir(1);
addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'){setDir(-1);e.preventDefault()}
  else if(k==='ArrowRight'||k==='d'||k==='D'){setDir(1);e.preventDefault()}
  else if(k===' '){if(!seg)begin(moveSel);e.preventDefault()}
});
$('freq').oninput=e=>{freq=+e.target.value};
$('gap').oninput=e=>{G=+e.target.value};
$('rl').oninput=e=>{RL=+e.target.value};
$('dbg').onchange=e=>{debug=e.target.checked};
$('hf').onchange=e=>{flipMode=e.target.value};
const jn=$('jn'),jx=$('jx'),jy=$('jy'),jo=$('jout');
const showJ=()=>{const v=ADJ[jn.value];jx.value=v[0];jy.value=v[1];$('jxv').textContent=v[0];$('jyv').textContent=v[1];jo.value=Object.entries(ADJ).map(([k,v])=>k+':'+v.join(',')).join('  ')};
jn.onchange=showJ;
jx.oninput=jy.oninput=()=>{ADJ[jn.value]=[+jx.value,+jy.value];showJ()};
$('jr').onclick=()=>{for(const k in ADJ)ADJ[k]=DEF[k].slice();showJ()};
jo.onfocus=()=>jo.select();
showJ();
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);lastP=pose();render(lastP);
  const s=seg?seg[0]:'walk',txt=seg?'技 '+MNAME[curMove]+'：'+LABEL[s]:'歩行　'+(dir>0?'→':'←');
  if(shown!==txt){shown=txt;stEl.textContent=txt}
  requestAnimationFrame(loop);
}
Promise.all(loads).then(()=>{last=performance.now();requestAnimationFrame(loop)});
</script>
</body>
